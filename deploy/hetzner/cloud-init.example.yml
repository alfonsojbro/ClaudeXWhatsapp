#cloud-config
# Example of the user-data document the phase 10 installer generates
# (apps/installer/src/cloud-init.template.yml). Placeholders only — no real values.
#
# SECURITY, STATED PLAINLY: Hetzner shows a server's user-data in its own console by
# design, so anyone with access to that Hetzner project can read this document. That is
# why the deploy key is a key created for this one repository and the tunnel token is
# revocable from the Cloudflare dashboard. bootstrap.sh shreds the on-disk copy of the
# user-data on first boot, guarded by a stamp file under /srv/cxw/state so a re-run
# does not fail.
#
# Everything sensitive is carried base64-encoded (`encoding: b64`) so it never appears
# as a shell word, a YAML-quoted string, or a log line.

package_update: true
packages:
  - ca-certificates
  - curl
  - git

write_files:
  # base64 of the unencrypted OpenSSH private half of the repository deploy key
  - path: /root/.ssh/cxw_deploy
    owner: 'root:root'
    permissions: '0600'
    encoding: b64
    content: BASE64_OF_THE_OPENSSH_PRIVATE_DEPLOY_KEY
  # base64 of the matching `ssh-ed25519 ... cxw-installer` line
  - path: /root/.ssh/cxw_deploy.pub
    owner: 'root:root'
    permissions: '0644'
    encoding: b64
    content: BASE64_OF_THE_PUBLIC_DEPLOY_KEY
  # base64 of the KEY=VALUE fragment bootstrap.sh sources once and merges into cxw.env:
  #   CXW_TUNNEL_TOKEN=...        CXW_SETUP_MODE=1
  #   CXW_CONSOLE_HOSTNAME=cxw.example.com
  #   CF_ACCESS_TEAM=...          CF_ACCESS_AUD=...
  #   CONSOLE_REQUIRE_ACCESS=true CONSOLE_HOST=127.0.0.1  CONSOLE_PORT=7803
  #   TZ=Europe/Prague            CXW_TIMEZONE=Europe/Prague
  #   CXW_OWNER_EMAIL=you@example.com
  #   TS_AUTHKEY=...              (only when a Tailscale auth key was given)
  - path: /root/cxw-installer.env
    owner: 'root:root'
    permissions: '0600'
    encoding: b64
    content: BASE64_OF_THE_INSTALLER_ENV_FRAGMENT

runcmd:
  # 1. the deploy key, for the unprivileged cxw user that owns the checkout
  - install -d -m 0700 -o root -g root /root/.ssh
  - id -u cxw >/dev/null 2>&1 || useradd --system --create-home --home-dir /home/cxw --shell /bin/bash cxw
  - install -d -m 0700 -o cxw -g cxw /home/cxw/.ssh
  - install -m 0600 -o cxw -g cxw /root/.ssh/cxw_deploy /home/cxw/.ssh/cxw_deploy
  # 2. github's host keys, so git is not prompted and does not trust on first use
  - ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> /home/cxw/.ssh/known_hosts
  - chown cxw:cxw /home/cxw/.ssh/known_hosts && chmod 0600 /home/cxw/.ssh/known_hosts
  # 3. the checkout
  - install -d -m 0711 -o root -g root /srv/cxw
  - install -d -m 0700 -o cxw -g cxw /srv/cxw/repo
  - sudo -u cxw -H git -c core.sshCommand='ssh -i /home/cxw/.ssh/cxw_deploy -o IdentitiesOnly=yes' clone --branch 'main' 'git@github.com:YOUR_ACCOUNT/YOUR_REPO.git' /srv/cxw/repo
  - sudo -u cxw -H git -C /srv/cxw/repo config core.sshCommand 'ssh -i /home/cxw/.ssh/cxw_deploy -o IdentitiesOnly=yes'
  # 4. bootstrap, with the installer's variables exported from the base64 fragment
  - set -a && . /root/cxw-installer.env && set +a && bash /srv/cxw/repo/deploy/hetzner/bootstrap.sh
